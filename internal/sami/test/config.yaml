arch-mapping:
  zen4: x86_64/amd/zen4
  zen5: x86_64/amd/zen5
  generic: x86_64/generic
accel-mapping:
  cc80: accel/nvidia/cc80
  cc90: accel/nvidia/cc90

rgw:
  bucket: sam-archives
  # endpoint: https://rgw.example.org  # optional; else AWS_ENDPOINT_URL env

sbatch-config:
  shared:
    header: "#sami --vanilla"
  partitions:
    zen4_gpu:
      qos: standard
      gres: "gpu:1"
      ntasks: 32
      mem: 256G
      cpus-per-task: 1
      threads-per-core: 1
    zen4_cpu:
      qos: standard
      ntasks: 32
      mem: 256G
      cpus-per-task: 1
      threads-per-core: 2
    zen5_gpu:
      qos: standard
      gres: "gpu:1"
      ntasks: 32
      mem: 256G
      cpus-per-task: 1
      threads-per-core: 1
